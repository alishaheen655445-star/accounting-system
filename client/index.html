<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>(function(){try{if(localStorage.getItem('app_theme')==='dark')document.documentElement.classList.add('dark');var a=localStorage.getItem('app_lang')==='ar'?'ar':'en';document.documentElement.lang=a;document.documentElement.dir=(a==='ar'?'rtl':'ltr');}catch(e){}})();</script>
  <title data-en="Login · Accounting System" data-ar="تسجيل الدخول · نظام المحاسبة">Login · Accounting System</title>
  <!-- Stitch design tokens (Tailwind theme). The Play CDN defines the `tailwind`
       global, so it MUST load BEFORE tailwind-config.js sets `tailwind.config`. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="ds bg-surface font-body text-on-surface">
  <!-- Language + theme toggles (fixed at the start-top corner) — wired in login.js -->
  <div class="fixed top-4 flex items-center gap-2" style="inset-inline-start:1rem">
    <button id="login-lang-btn" title="Switch language · بدّل اللغة"
      class="flex items-center justify-center gap-1.5 h-10 px-3 rounded-xl bg-surface-container-high text-on-surface hover:bg-surface-container-highest font-label-md">
      <span class="material-symbols-outlined text-[20px]">translate</span><span id="login-lang-label"></span>
    </button>
    <button id="login-theme-btn" title="Theme · المظهر"
      class="flex items-center justify-center w-10 h-10 rounded-xl bg-surface-container-high text-on-surface hover:bg-surface-container-highest">
      <span class="material-symbols-outlined text-[20px]">dark_mode</span>
    </button>
  </div>

  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <!-- Brand -->
      <div class="flex items-center justify-center gap-3 mb-6">
        <span class="material-symbols-outlined text-primary text-[32px]">account_balance</span>
        <h1 class="font-headline-lg text-headline-lg text-primary" style="margin:0" data-en="Double-Entry Accounting" data-ar="المحاسبة المزدوجة">Double-Entry Accounting</h1>
      </div>

      <!-- Login card -->
      <div class="bg-surface-container-lowest p-8 rounded-2xl shadow-sm">
        <p class="text-on-surface-variant font-body-md" style="margin:0 0 1.5rem" data-en="Sign in to continue" data-ar="سجّل الدخول للمتابعة">Sign in to continue</p>

        <!-- Alert box (errors show here) -->
        <div id="alert" class="alert alert-error hidden" style="margin:0 0 1rem"></div>

        <form id="login-form" autocomplete="off" novalidate class="space-y-4">
          <div class="form-group">
            <label for="identifier" data-en="Username" data-ar="اسم المستخدم">Username</label>
            <input id="identifier" name="identifier" type="text" data-en-ph="e.g. admin" data-ar-ph="مثال: admin" placeholder="e.g. admin" required />
          </div>
          <div class="form-group">
            <label for="password" data-en="Password" data-ar="كلمة المرور">Password</label>
            <input id="password" name="password" type="password" placeholder="••••••••" required />
          </div>
          <button id="login-btn" class="btn" type="submit" style="width:100%" data-en="Sign in" data-ar="دخول">Sign in</button>
        </form>

        <div class="demo-box" style="margin-top:1.5rem">
          <strong data-en="Demo accounts" data-ar="حسابات تجريبية">Demo accounts</strong><br />
          <span data-en="Admin" data-ar="مدير">Admin</span> <code>admin / Admin@123</code><br />
          <span data-en="Accountant" data-ar="محاسب">Accountant</span> <code>accountant / Accountant@123</code><br />
          <span data-en="Viewer (read-only)" data-ar="مشاهد (للقراءة فقط)">Viewer (read-only)</span> <code>viewer / Viewer@123</code>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts: order matters (config -> api -> auth -> shared ui -> page logic) -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
